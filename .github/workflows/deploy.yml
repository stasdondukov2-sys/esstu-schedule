name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Обновить все группы перед публикацией (занимает больше времени)'
        type: boolean
        default: false
  schedule:
    # Refresh published schedules every three hours (UTC).
    - cron: "0 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build local stylesheet
        run: |
          npm ci --ignore-scripts
          npm run build:css

      - name: Refresh official department and group snapshots
        if: github.event_name == 'schedule' || inputs.full_sync == true
        run: python -u sync_esstu.py

      - name: Refresh departments for a quick site release
        if: github.event_name != 'schedule' && inputs.full_sync != true
        run: python -u sync_departments.py

      - name: Build static site & API JSON
        run: python build_static_site.py

      - name: Verify schedule data and app behavior
        run: |
          python -m unittest test_rooms test_teachers test_sync test_study test_audit test_p0
          node test_experience.cjs
          node test_sw.cjs
          node test_teacher_search.cjs
          node test_campus.cjs
          node test_study.cjs
          node test_reference.cjs
          node test_assets.cjs
          node test_avatars.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
