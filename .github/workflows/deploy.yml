name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Обновить все группы перед публикацией (занимает больше времени)'
        type: boolean
        default: false
  schedule:
    # Refresh published schedules every three hours (UTC).
    - cron: "0 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build local stylesheet
        run: |
          npm ci --ignore-scripts
          npm run build:css

      - name: Refresh official department and group snapshots
        if: github.event_name == 'schedule' || inputs.full_sync == true
        run: python -u -m scripts.sync_esstu

      - name: Refresh departments for a quick site release
        if: github.event_name != 'schedule' && inputs.full_sync != true
        run: python -u -m scripts.sync_departments

      - name: Build static site & API JSON
        run: python -m scripts.build_static_site

      - name: Verify schedule data and app behavior
        run: |
          python -m unittest discover -s tests -t .
          npm run test:unit

      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
