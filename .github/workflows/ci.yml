name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sync_sources:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Python dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff and pytest
        run: |
          ruff check .
          ruff format --check .
          pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build local stylesheet
        run: |
          npm ci --ignore-scripts
          npm run build:css
      - name: Find latest synchronized snapshots
        if: inputs.sync_sources != true && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            let runs;
            try{runs=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'sync.yml',branch:'main',status:'success',per_page:10});}
            catch(error){if(error.status===404){core.info('No synchronization history yet; using repository snapshots.');return;}throw error;}
            for(const run of runs.data.workflow_runs){
              const result=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id});
              if(result.data.artifacts.some(artifact=>artifact.name==='source-snapshot' && !artifact.expired)){
                core.setOutput('run_id',String(run.id));break;
              }
            }
      - uses: actions/download-artifact@v4
        if: steps.snapshot.outputs.run_id != ''
        with:
          name: source-snapshot
          path: demo_data
          run-id: ${{ steps.snapshot.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Synchronize sources
        if: inputs.sync_sources == true
        run: |
          python -u -m scripts.sync_esstu
          python -m scripts.check_sync
      - name: Static build and JS checks
        run: |
          python -m scripts.build_static_site
          npm run test:unit
      - name: Browser and accessibility regressions
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: |
            demo_data/*sync.json
            dist/api/status.json
            dist/api/sources.json
            test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: inputs.sync_sources == true
        with:
          name: source-snapshot
          path: demo_data
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true
        with:
          path: dist

  deploy:
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
