name: CI and Pages

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sync_sources:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'main-data-and-code' || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.11'
      - name: Install locked Python dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff and pytest
        run: |
          ruff check .
          ruff format --check .
          pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: '22'
          cache: npm
      - name: Build local stylesheet
        run: |
          npm ci --ignore-scripts
          npm run build:css
      - name: Find latest synchronized snapshots
        if: inputs.sync_sources != true && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        with:
          script: |
            const {owner,repo}=context.repo;
            let runs;
            try{runs=await github.paginate(github.rest.actions.listWorkflowRuns,{owner,repo,workflow_id:'sync.yml',branch:'main',per_page:100});}
            catch(error){if(error.status===404){core.info('No synchronization history yet; using repository snapshots.');return;}throw error;}
            for(const run of runs){
              const result=await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id});
              if(result.data.artifacts.some(artifact=>artifact.name==='source-snapshot' && !artifact.expired)){
                core.setOutput('run_id',String(run.id));return;
              }
            }
            core.warning('No retained source snapshot found; using repository data with its original freshness dates.');
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        if: steps.snapshot.outputs.run_id != ''
        with:
          name: source-snapshot
          path: demo_data
          run-id: ${{ steps.snapshot.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Synchronize sources
        if: inputs.sync_sources == true
        run: |
          python -u -m scripts.sync_esstu
          python -m scripts.check_sync
      - name: Static build and JS checks
        run: |
          python -m scripts.build_static_site
          npm run test:unit
      - name: Browser and accessibility regressions
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: diagnostics-${{ github.run_id }}
          path: |
            demo_data/*sync.json
            dist/api/status.json
            dist/api/sources.json
            test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        if: inputs.sync_sources == true
        with:
          name: source-snapshot
          path: demo_data
          retention-days: 14
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (Node 24)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true
        with:
          path: dist

  deploy:
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node 24)
        id: deployment
