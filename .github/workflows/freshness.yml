name: Published data freshness

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['CI and Pages', 'Scheduled source synchronization']
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: published-data-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # workflow_run uses trusted default-branch code, never the triggering PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {monitor}=require('./scripts/freshness.cjs');
            const problem=await monitor({github,context});
            if(problem)core.warning(problem);
